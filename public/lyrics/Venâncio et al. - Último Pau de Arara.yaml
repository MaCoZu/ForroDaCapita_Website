intro: |-
  "Último Pau de Arara" (composed by Venâncio, Corumba, and J. Guimarães, immortalized by Ary Lobo and Fagner) is a canonical anthem of Northeastern identity and resilience. It encapsulates the sertanejo's resistance to abandoning their homeland. Vowing to leave only on the "last lorry" (Último Pau de Arara) to the city is a call for perseverance in the face of prolonged droughts.
footnotes:
- id: 1
  term: Cariri
  explanation_en: |-
    Cariri is an oasis-like sub-region in the sertão, celebrated for its fertile valleys amid dry thorny scrub.
    
    The exclusively Brazilian ecosystem of the sertão, called Caatinga, is adapted to extremely arid conditions and has a remarkable potential for regeneration. The Caatinga covers nearly 10% of Brazil's territory, is home to 26 million people and over 2,000 species of plants, fish, reptiles, amphibians, birds, and mammals. Some of which cannot be found anywhere else on the planet.
    
    In Forró lyrics Cariri serves as an icon of origin, agricultural hope, and nostalgic homecoming (saudade).
- id: 2
  term: Pau de Arara
  explanation_en: |-
    Literally "macaw's perch", originally meant the bird sellers' practice of tying a parrot to a stick for exhibition. Pau de Arara is also an illustrative name given to a torture method widely used during the military dictatorship in Brazil (1964 -1985). Whereby the victim is bound very uncomfortably to a pole, hanging upside down.
    
    Northeastern farmers fleeing the severe drought hop on open flatbed trucks fitted with wooden planks. The torturous journey stretches thousands of kilometers, over bad roads and potholes, to Southeastern industrial centers like São Paulo. These trucks became known as Pau de Araras for obvious reasons.
- id: 3
  term: Chocalho
  explanation_en: |-
    A traditional bronze or iron cowbell worn around livestock's necks. During droughts, cattle often become severely emaciated. A cow that is only "skin and bone" but can still carry her bell, is a sign of hope, for the rain to fall, the sertão to blossom and to stay on one's native soil.